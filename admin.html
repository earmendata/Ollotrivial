:root{--bg:#eef7f0;--card:#fff;--text:#1c2b22;--accent:#2f9e5c;--accent2:#1b7a44;--muted:#6b8577;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;margin:0;padding:20px;}
.wrap{max-width:520px;margin:0 auto;}
h1{font-size:22px;margin-bottom:4px;}
p.sub{color:var(--muted);font-size:14px;margin-top:0;}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 16px #0000000f;}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px;}
input[type=text],input[type=file],select{width:100%;padding:10px;border-radius:10px;border:1px solid #00000022;font-size:15px;background:#fff;color:var(--text);}
.photo-label{display:block;padding:16px;border:2px dashed var(--muted);border-radius:12px;text-align:center;cursor:pointer;}
img.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px;display:none;}
button{cursor:pointer;border:none;border-radius:10px;font-size:15px;padding:12px 18px;}
.btn-primary{background:var(--accent2);color:#fff;width:100%;margin-top:16px;}
.btn-secondary{background:#25D366;color:#fff;width:100%;margin-top:10px;}
.item{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid #0000000f;}
.item img{width:50px;height:50px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.item .meta{flex:1;font-size:13px;}
.item .del{background:#e0455a;color:#fff;padding:6px 10px;font-size:12px;}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:16px;}
.count{font-size:13px;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
  <h1>🌍 OlloTrivial Admin</h1>
  <button id="installBtn" style="display:none;width:100%;margin-bottom:14px;background:var(--accent2);color:#fff;border:none;border-radius:10px;padding:12px;font-size:15px;">📲 Añadir a la pantalla de inicio</button>
  <p class="sub">Compón tus preguntas aquí (foto + pregunta + respuestas). Si eres Edu, también puedes importar los archivos de otros editores, revisarlos y editarlos todos juntos antes de exportar el archivo final.</p>

  <div class="card">
    <label>Tu nombre (para que Edu sepa de quién es este archivo)</label>
    <input type="text" id="authorName" placeholder="Ej: Edu, María, Jon…">

    <label>Foto</label>
    <label class="photo-label" for="photo" id="photoLabel">📷 Toca para elegir una foto</label>
    <input type="file" accept="image/*" id="photo">
    <img class="preview" id="preview">

    <label>Pregunta</label>
    <input type="text" id="qtext" placeholder="Escribe la pregunta">

    <label>Respuesta 1</label><input type="text" id="opt0" placeholder="Opción 1">
    <label>Respuesta 2</label><input type="text" id="opt1" placeholder="Opción 2">
    <label>Respuesta 3</label><input type="text" id="opt2" placeholder="Opción 3">
    <label>Respuesta 4</label><input type="text" id="opt3" placeholder="Opción 4">

    <label>¿Cuál es la correcta?</label>
    <select id="correct">
      <option value="0">Respuesta 1</option>
      <option value="1">Respuesta 2</option>
      <option value="2">Respuesta 3</option>
      <option value="3">Respuesta 4</option>
    </select>

    <button class="btn-primary" id="addBtn">➕ Añadir a la lista</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card">
    <label>Importar archivo(s) de otros editores</label>
    <label class="photo-label" for="importFile" id="importLabel">📂 Toca para elegir uno o varios .json</label>
    <input type="file" accept=".json,application/json" id="importFile" multiple>
    <div class="status" id="importStatus"></div>
  </div>

  <div class="card">
    <div class="count" id="count">0 preguntas en la lista</div>
    <div id="list"></div>
    <label>Nombre del archivo a descargar</label>
    <input type="text" id="fileName" placeholder="Ej: preguntas-maria-1">
    <button class="btn-secondary" id="exportBtn">⬇️ Exportar archivo</button>
  </div>
</div>

<script>
let questions = [];

function fileToCompressedDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 800;
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        let q=0.8, dataUrl=canvas.toDataURL('image/jpeg', q);
        while(dataUrl.length>235000 && q>0.4){ q-=0.05; dataUrl=canvas.toDataURL('image/jpeg', q); }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const photoInput=document.getElementById('photo');
const photoLabel=document.getElementById('photoLabel');
const preview=document.getElementById('preview');
let currentDataUrl=null;

photoInput.addEventListener('change', async ()=>{
  const f=photoInput.files[0];
  if(!f) return;
  photoLabel.textContent='Procesando…';
  try{
    currentDataUrl = await fileToCompressedDataUrl(f);
    preview.src=currentDataUrl;
    preview.style.display='block';
    photoLabel.textContent='✅ '+f.name;
  }catch(e){
    photoLabel.textContent='No se pudo leer la foto, prueba otra';
    currentDataUrl=null;
  }
});

document.getElementById('addBtn').onclick=()=>{
  const status=document.getElementById('status');
  const qtext=document.getElementById('qtext').value.trim();
  const opts=[0,1,2,3].map(i=>document.getElementById('opt'+i).value.trim());
  const correct=parseInt(document.getElementById('correct').value);
  if(!currentDataUrl || !qtext || opts.some(o=>!o)){
    status.textContent='Rellena la foto, la pregunta y las 4 respuestas.';
    return;
  }
  const author=document.getElementById('authorName').value.trim();
  questions.push({q:qtext, opts, correct, photoUrl:currentDataUrl, ts:Date.now(), author});
  status.textContent='¡Añadida a la lista!';
  document.getElementById('qtext').value='';
  [0,1,2,3].forEach(i=>document.getElementById('opt'+i).value='');
  photoInput.value=''; currentDataUrl=null; preview.style.display='none';
  photoLabel.textContent='📷 Toca para elegir una foto';
  renderList();
};

function esc(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderList(){
  document.getElementById('count').textContent = questions.length + (questions.length===1 ? ' pregunta en la lista' : ' preguntas en la lista');
  const list=document.getElementById('list');
  list.innerHTML = questions.map((item,idx)=>`
    <div class="item">
      <img src="${item.photoUrl}">
      <div class="meta">${esc(item.q)}${item.author?`<br><span style="color:var(--muted);font-size:11px;">de ${esc(item.author)}</span>`:''}</div>
      <button class="edit" data-idx="${idx}" style="background:var(--accent);color:#fff;padding:6px 10px;font-size:12px;border-radius:8px;border:none;margin-right:4px;">Editar</button>
      <button class="del" data-idx="${idx}">Quitar</button>
    </div>
  `).join('');
  list.querySelectorAll('.del').forEach(btn=>{
    btn.onclick=()=>{ questions.splice(parseInt(btn.dataset.idx),1); renderList(); };
  });
  list.querySelectorAll('.edit').forEach(btn=>{
    btn.onclick=()=>{
      const idx=parseInt(btn.dataset.idx);
      const item=questions[idx];
      document.getElementById('qtext').value=item.q;
      [0,1,2,3].forEach(i=>document.getElementById('opt'+i).value=item.opts[i]||'');
      document.getElementById('correct').value=item.correct;
      document.getElementById('authorName').value=item.author||'';
      currentDataUrl=item.photoUrl;
      preview.src=item.photoUrl;
      preview.style.display='block';
      photoLabel.textContent='✅ Foto cargada (editando)';
      questions.splice(idx,1);
      renderList();
      document.getElementById('status').textContent='Editando — cambia lo que quieras y pulsa "Añadir a la lista" para guardarlo.';
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
}

document.getElementById('importFile').addEventListener('change', async ()=>{
  const files=Array.from(document.getElementById('importFile').files||[]);
  const importStatus=document.getElementById('importStatus');
  if(!files.length) return;
  let added=0, skipped=0;
  for(const f of files){
    try{
      const text=await f.text();
      const data=JSON.parse(text);
      const arr=Array.isArray(data)?data:[data];
      for(const item of arr){
        if(item && typeof item.q==='string' && Array.isArray(item.opts) && item.opts.length===4 && item.photoUrl){
          questions.push({q:item.q, opts:item.opts, correct:item.correct|0, photoUrl:item.photoUrl, ts:item.ts||Date.now(), author:item.author||''});
          added++;
        } else {
          skipped++;
        }
      }
    }catch(e){ skipped++; }
  }
  importStatus.textContent = `Importadas ${added} preguntas` + (skipped?` (${skipped} no válidas)`:'') + '.';
  document.getElementById('importFile').value='';
  renderList();
});

function defaultStamp(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}

const fileNameInput=document.getElementById('fileName');
function refreshDefaultFileName(){
  if(fileNameInput.value.trim()) return; // don't overwrite something the user already typed
  const author=document.getElementById('authorName').value.trim();
  const base = author ? `ollotrivial-${author.toLowerCase().replace(/[^a-z0-9]+/gi,'-')}` : 'ollotrivial-preguntas';
  fileNameInput.placeholder = `${base}-${defaultStamp()}`;
}
document.getElementById('authorName').addEventListener('input', refreshDefaultFileName);
refreshDefaultFileName();

document.getElementById('exportBtn').onclick=()=>{
  if(!questions.length){ document.getElementById('status').textContent='Añade alguna pregunta primero.'; return; }
  const blob=new Blob([JSON.stringify(questions,null,2)], {type:'application/json'});
  const url=URL.createObjectURL(blob);
  let name=fileNameInput.value.trim() || fileNameInput.placeholder || `ollotrivial-preguntas-${defaultStamp()}`;
  name=name.replace(/[^a-z0-9_\-]+/gi,'-').replace(/^-+|-+$/g,'');
  if(!/\.json$/i.test(name)) name+='.json';
  const a=document.createElement('a');
  a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  // next export gets a fresh default suggestion
  fileNameInput.value='';
  refreshDefaultFileName();
};

let deferredPrompt=null;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt=e;
  installBtn.style.display='block';
});
installBtn.addEventListener('click', async ()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt=null;
  installBtn.style.display='none';
});
window.addEventListener('appinstalled', ()=>{ installBtn.style.display='none'; });
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('admin-sw.js').catch(()=>{});
}
</script>
</body>
</html>

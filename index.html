<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¿Cuánto sabes de Valdeollo?</title>
<meta property="og:title" content="¿Cuánto sabes de Valdeollo?">
<meta property="og:description" content="Pon a prueba lo que sabes del Valle de Ollo 🌍">
<meta property="og:type" content="website">
<style>
:root{
  --bg:#eef7f0; --card:#ffffff; --text:#1c2b22; --accent:#2f9e5c;
  --accent2:#1b7a44; --wrong:#e0455a; --muted:#6b8577;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#101a13; --card:#1a2820; --text:#eaf3ec; --muted:#93a89b; }
}
:root[data-theme="dark"]{ --bg:#101a13; --card:#1a2820; --text:#eaf3ec; --muted:#93a89b; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100%; padding:0; display:block;
}
.wrap{width:100%; max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
.progress{height:6px; background:#00000022;}
.progress-bar{height:100%; background:var(--accent); width:0%; transition:width .4s;}
.timerwrap{height:4px; background:#00000014;}
.timerbar{height:100%; background:var(--wrong); width:100%; transition:width .1s linear;}
.card{
  flex:1; background:var(--card); text-align:center; display:flex; flex-direction:column;
}
.card.shake .options{animation:shake .4s;}
.card.pulse .photo-full{animation:pulse .5s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.03)}100%{transform:scale(1)}}
.card{ position:relative; overflow:hidden; }
.photo-full{
  position:absolute; inset:0; width:100%; height:100%;
  object-fit:cover; display:block; z-index:0; background:#0002;
}
.overlay{
  position:absolute; inset:0; z-index:1;
  background:linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.88) 75%, rgba(0,0,0,0.94) 100%);
}
.quit-btn{
  position:absolute; top:calc(14px + env(safe-area-inset-top,0px)); right:14px; z-index:3;
  background:rgba(0,0,0,0.45); color:#fff; border:none; border-radius:20px;
  padding:8px 14px; font-size:13px; cursor:pointer;
}
.qbody{
  position:relative; z-index:2; padding:22px; flex:1; display:flex; flex-direction:column;
  justify-content:flex-end; min-height:100%; color:#fff;
}
.timeleft{font-size:13px; color:#e8f3ec; margin-bottom:8px; text-shadow:0 1px 3px rgba(0,0,0,.6);}
h2{font-size:24px; line-height:1.4; margin:0 0 20px; text-shadow:0 1px 4px rgba(0,0,0,.7);}
.options{margin-top:auto;}
.opt{
  display:block; width:100%; padding:12px 14px; margin:6px 0; border-radius:10px; border:1px solid rgba(255,255,255,0.35);
  background:rgba(255,255,255,0.14); backdrop-filter:blur(2px); color:#fff; font-size:18px; cursor:pointer; text-align:left;
}
.quit-btn{display:none;}
.nick-input{width:100%; padding:12px; border-radius:10px; border:1px solid #00000022; font-size:16px; text-align:center; margin-bottom:14px; background:var(--card); color:var(--text);}
.lb-row{display:flex; justify-content:space-between; padding:5px 0; font-size:14px;}
.lb-wrap{text-align:left; max-width:280px; margin:14px auto 0;}
.opt:active{transform:scale(0.98);}
.opt.correct{background:var(--accent); border-color:var(--accent); color:white; font-weight:600;}
.opt.wrong{background:var(--wrong); border-color:var(--wrong); color:white;}
.opt[disabled]{pointer-events:none;}
.next{margin-top:16px; padding:12px 20px; border:none; border-radius:12px; background:var(--accent2); color:white; font-size:15px; cursor:pointer; display:none;}
.footer{margin-top:14px; color:var(--muted); font-size:13px;}
.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5;}
.confetti span{position:absolute; top:-20px; font-size:20px; animation:fall 1.1s ease-in forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg); opacity:0.2;}}
.score-num{font-size:52px; font-weight:800; color:var(--accent2); margin:10px 0;}
</style>
</head>

      <p style="color:var(--muted);margin-bottom:16px;">Pon tu nombre para salir en la clasificación</p>
      <input class="nick-input" id="nickInput" maxlength="18" placeholder="Tu nickname">
      <button class="next" style="display:inline-block" id="startBtn">Jugar →</button>
    </div>`;
  const go=()=>{
    const v=document.getElementById('nickInput').value.trim();
    nickname = v || 'Jugador anónimo';
    quitBtn.style.display='inline-block';
    i=0; score=0;
    render();
  };
  document.getElementById('startBtn').onclick=go;
  document.getElementById('nickInput').addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

const TIME=15000;

function render(){
  bar.style.width=(i/GAME.length*100)+'%';
  if(i>=GAME.length) return renderEnd();
  const item=GAME[i];
  card.innerHTML=`
    <img class="photo-full" src="${item.photoUrl}" alt="foto">
    <div class="overlay"></div>
    <div class="qbody">
      <div class="timeleft" id="timeleft">10s</div>
      <h2>${item.q}</h2>
      <div class="options">
        ${item.opts.map((o,idx)=>`<button class="opt" data-idx="${idx}">${o}</button>`).join('')}
        <button class="next" id="nextBtn">Siguiente →</button>
      </div>
    </div>
  `;
  card.className='card';
  card.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick=()=>answer(parseInt(btn.dataset.idx));
  });
  startTimer();
}

function startTimer(){
  const start=Date.now();
  timerbar.style.transition='none';
  timerbar.style.width='100%';
  requestAnimationFrame(()=>{ timerbar.style.transition='width 0.1s linear'; });
  timerInterval=setInterval(()=>{
    const elapsed=Date.now()-start;
    const pct=Math.max(0,100-(elapsed/TIME*100));
    timerbar.style.width=pct+'%';
    const secLeft=Math.ceil((TIME-elapsed)/1000);
    const tl=document.getElementById('timeleft');
    if(tl) tl.textContent=Math.max(secLeft,0)+'s';
    if(elapsed>=TIME){
      clearInterval(timerInterval);
      answer(-1, true);
    }
  },100);
}

function answer(idx, timedOut){
  clearInterval(timerInterval);
  const item=GAME[i];
  const btns=card.querySelectorAll('.opt');
  btns.forEach(b=>b.disabled=true);
  if(idx===item.correct){
    score++;
    btns[idx].classList.add('correct');
    card.classList.add('pulse');
    confetti();
  } else {
    if(idx>=0) btns[idx].classList.add('wrong');
    btns[item.correct].classList.add('correct');
    card.classList.add('shake');
  }
  const tl=document.getElementById('timeleft');
  if(tl) tl.textContent = timedOut ? '⏱️ ¡Tiempo agotado!' : '';
  document.getElementById('nextBtn').style.display='inline-block';
  document.getElementById('nextBtn').onclick=()=>{ i++; render(); };
}

function confetti(){
  const c=document.createElement('div');
  c.className='confetti';
  const emojis=['🎉','🌿','🍃','🌟'];
  for(let k=0;k<14;k++){
    const s=document.createElement('span');
    s.textContent=emojis[k%emojis.length];
    s.style.left=Math.random()*100+'%';
    s.style.animationDelay=(Math.random()*0.3)+'s';
    c.appendChild(s);
  }
  document.body.appendChild(c);
  setTimeout(()=>c.remove(),1400);
}

function nickId(name){
  return (name||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').slice(0,40) || 'jugador';
}

function renderEnd(){
  bar.style.width='100%';
  quitBtn.style.display='none';
  let msg;
  const pct = GAME.length ? score/GAME.length : 0;
  if(pct < 0.4) msg="Te falta mucho que aprender sobre el Valle de Ollo 🌱";
  else if(pct < 0.8) msg="Eres un buen conocedor o conocedora del Valle de Ollo 🌿";
  else msg="Eres un experto o una experta en el Valle de Ollo 🏔️";
  card.innerHTML=`
    <div style="font-size:70px; padding:26px 0 0;">🏆</div>
    <h2>¡Juego terminado, ${esc(nickname)}!</h2>
    <div class="score-num">${score} / ${GAME.length}</div>
    <p>${msg}</p>
    <div id="leaderboard" style="margin-top:6px;font-size:14px;color:var(--muted);">​</div>
    <button class="next" style="display:inline-block" id="retry">Jugar de nuevo</button>
    <div class="footer">Un juego de OlloTrivial</div>
  `;
  document.getElementById('retry').onclick=()=>{renderNickname();};
  showLocalLeaderboard();
}

function showLocalLeaderboard(){
  const id = nickId(nickname);
  try{
    const key='ecotrivia_scores';
    const arr=JSON.parse(localStorage.getItem(key)||'[]');
    const existing=arr.find(e=>nickId(e.nickname)===id);
    if(existing){ existing.points=(existing.points||0)+score; existing.plays=(existing.plays||0)+1; }
    else arr.push({nickname, points:score, plays:1});
    arr.sort((a,b)=>b.points-a.points);
    localStorage.setItem(key, JSON.stringify(arr.slice(0,50)));
    const list=arr.slice(0,10);
    const lbEl=document.getElementById('leaderboard');
    if(!lbEl || !list.length) return;
    let html=`<div class="lb-wrap"><div style="font-weight:600;margin-bottom:4px;color:var(--text);">🏅 Clasificación (en este dispositivo)</div>`;
    list.forEach((e,idx)=>{
      const mine = nickId(e.nickname)===id;
      html += `<div class="lb-row" style="${mine?'font-weight:700;color:var(--accent2);':''}"><span>${idx+1}. ${esc(e.nickname||'Jugador')}</span><span>${e.points} pts</span></div>`;
    });
    html += `</div>`;
    lbEl.innerHTML=html;
  }catch(e){}
}

quitBtn.onclick=()=>{
  if(confirm('¿Seguro que quieres abandonar la partida?')){
    clearInterval(timerInterval);
    quitBtn.style.display='none';
    card.className='card';
    card.innerHTML=`
      <div style="position:relative; z-index:2; padding:40px 22px; text-align:center;">
        <div style="font-size:60px;">👋</div>
        <h2>Partida abandonada</h2>
        <p>Tu puntuación fue ${score} / ${GAME.length}.</p>
        <button class="next" style="display:inline-block" id="restartBtn">Volver a jugar</button>
      </div>`;
    document.getElementById('restartBtn').onclick=()=>{ renderNickname(); };
  }
};

renderNickname();
</script>
</body>
</html>
